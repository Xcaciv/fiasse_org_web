name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Insert mid-body comment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from binascii import unhexlify

          files = [
              Path("src/index.html"),
              Path("src/assess/index.html"),
              Path("src/campaign/security_property.html"),
          ]
            
          comment_b16 = ""
          comment = unhexlify(comment_b16).decode("utf-8")

          for file_path in files:
              content = file_path.read_text(encoding="utf-8")
              lower = content.lower()

              body_tag_start = lower.find("<body")
              if body_tag_start == -1:
                  raise RuntimeError(f"No <body> tag found in {file_path}")

              body_open_end = content.find(">", body_tag_start)
              if body_open_end == -1:
                  raise RuntimeError(f"Malformed <body> tag in {file_path}")

              body_start = body_open_end + 1
              body_end = lower.find("</body>", body_start)
              if body_end == -1:
                  raise RuntimeError(f"No </body> tag found in {file_path}")

              midpoint = body_start + ((body_end - body_start) // 2)
                line_end = content.find(">", midpoint, body_end)
                if line_end == -1:
                  raise RuntimeError(f"No newline found after midpoint in {file_path}")

                line_break = "\r\n" if line_end > 0 and content[line_end - 1] == "\r" else "\n"
                insert_at = line_end + 1
                updated = content[:insert_at] + comment + line_break + content[insert_at:]
              file_path.write_text(updated, encoding="utf-8")

          print("Inserted comments into target HTML files.")
          PY
      - name: Check THIRDPARTIES.md freshness
        shell: bash
        run: |
          npm run thirdparties

          if ! git diff --quiet -- THIRDPARTIES.md; then
            echo "::warning file=THIRDPARTIES.md::THIRDPARTIES.md is out of date. Run 'npm run thirdparties' and commit the updated file."
          fi
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_MUD_0CDEB761E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/src" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "/src" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_MUD_0CDEB761E }}
          action: "close"
